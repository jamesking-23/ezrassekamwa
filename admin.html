<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Site editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head><body>

<div id="login" class="card login hide">
<h2>Sign in</h2>
<form id="lf"><div class="fld"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
<div class="fld"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
<div style="margin-top:14px"><button class="btn" type="submit">Sign in</button></div><p class="msg err" id="lmsg"></p></form></div>

<div id="deny" class="card login hide"><h2>Not authorised</h2><p>This account is not the site owner.</p><button class="btn sec" id="out2">Sign out</button></div>

<div id="app" class="hide pv-on">
  <div class="top"><h1>Site editor</h1><span class="grow"></span>
    <button class="btn sec sm" id="pvToggle" type="button">Preview</button>
    <a class="btn sec sm" href="./" target="_blank" rel="noopener" style="text-decoration:none">View site</a>
    <button class="btn sec sm" id="out" type="button">Sign out</button></div>
  <nav class="nav" id="nav"></nav>
  <main id="main"></main>
  <aside class="pvpane" id="pvpane">
    <div class="pvbar"><button class="btn sec sm on" data-w="100%" type="button">Desktop</button><button class="btn sec sm" data-w="820px" type="button">Tablet</button><button class="btn sec sm" data-w="390px" type="button">Phone</button><span class="grow"></span><button class="btn sec sm" id="pvReload" type="button">Reload</button><button class="btn sec sm" id="pvClose" type="button">Close</button></div>
    <div class="pvwrap"><iframe id="pv" title="Live preview" src="about:blank"></iframe></div>
  </aside>
  <div class="bar"><div class="st" id="st">Loading…</div>
    <button class="btn sec" id="discard" type="button" disabled>Discard changes</button>
    <button class="btn" id="publish" type="button" disabled>Publish</button></div>
</div>

<div id="modal" class="modal hide"><div class="box" id="modalBox"></div></div>

<script src="cms.js"></script>
<script src="admin.js"></script>
</body></html>
