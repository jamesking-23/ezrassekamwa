<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume — Ezra J.L. Ssekamwa</title>
<meta name="description" content="Resume of Ezra J.L. Ssekamwa, civil engineering graduate (Kabale University) with building-construction internship experience in Kampala and Wakiso, Uganda.">
<meta property="og:title" content="Resume — Ezra J.L. Ssekamwa"><meta property="og:type" content="profile">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16181d;--mute:#5d636e;--line:#e4e6ea;--bg:#fff;--accent:#1f4fd8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.bar{max-width:980px;margin:0 auto;padding:22px 24px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:500}
.bar a{text-decoration:none}.bar a:hover{text-decoration:underline}
main{max-width:980px;margin:0 auto;padding:24px 24px 72px}
h1.title{font-family:"Bagel Fat One","Arial Black",sans-serif;font-weight:400;font-size:clamp(64px,13vw,132px);line-height:.95;letter-spacing:-.01em;margin:0 0 28px}
.who{padding-bottom:28px;border-bottom:2px solid var(--ink)}
.who h2{margin:0;font-size:clamp(24px,3.4vw,32px);line-height:1.2;font-weight:600;letter-spacing:-.01em}
.who .hl{margin:6px 0 0;font-size:18px;color:var(--mute)}
.contact{display:flex;flex-wrap:wrap;gap:6px 22px;margin:18px 0 0;padding:0;list-style:none;font-size:15px}
.contact a{text-decoration:none;border-bottom:1px solid var(--line)}.contact a:hover{border-color:var(--ink)}
.contact li.m{color:var(--mute)}
section.sec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:8px 40px;padding:30px 0;border-bottom:1px solid var(--line)}
section.sec>h3{margin:4px 0 0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 24px;margin:0 0 16px}
.row:last-child{margin-bottom:0}
.row .t{font-weight:600}.row .o{color:var(--mute)}.row .p{color:var(--mute);font-size:14px;white-space:nowrap;text-align:right}
.job{margin:0 0 28px}.job:last-child{margin-bottom:0}
.job .top{display:flex;justify-content:space-between;gap:8px 24px;flex-wrap:wrap}
.job .r{font-weight:600}.job .d{color:var(--mute);font-size:14px}.job .pl{color:var(--mute);font-size:14px;margin:2px 0 8px}
.job ul{margin:0;padding-left:20px}.job li{margin:0 0 6px;padding-left:2px}
.pairs{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.pairs li{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dotted var(--line);padding-bottom:8px}
.pairs li span:last-child{color:var(--mute);text-align:right}
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.refs div b{display:block;font-weight:600}.refs div span{color:var(--mute);font-size:15px;display:block}
.note{margin:26px 0 0;color:var(--mute);font-size:14px}
footer{max-width:980px;margin:0 auto;padding:0 24px 40px;display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
@media(max-width:720px){
  .bar{padding:16px 20px}main{padding:12px 20px 56px}footer{padding:0 20px 32px}
  section.sec{grid-template-columns:1fr;padding:24px 0}
  .row{grid-template-columns:1fr}.row .p{text-align:left}
}
@media print{.bar,footer{display:none}main{padding:0}section.sec{break-inside:avoid}h1.title{font-size:56px}}
.dl{display:inline-block;margin-top:18px;padding:9px 20px;border:1px solid currentColor;border-radius:999px;font-size:14px;font-weight:500;text-decoration:none;color:inherit;transition:background .25s,color .25s}.dl:hover,.dl:focus-visible{background:#111214;color:#fff}</style></head>
<body>
<header class="bar"><a href="./">&larr; Back to home</a><span>Ezra J.L. Ssekamwa</span></header>
<main>
<h1 class="title">Resume</h1>
<div id="app"><!--PRERENDER--></div>
<noscript><p>This page needs JavaScript to display the resume.</p></noscript>
</main>
<footer><span>&copy;2026 Ezra J.L. Ssekamwa</span><a href="#" id="top">Back to top</a></footer>
<script src="cms.js"></script>
<script>
(function(){
var DEFAULT={"name": "Ezra J.L. Ssekamwa", "headline": "Civil Engineering Graduate, Kabale University", "location": "Kampala, Central Region, Uganda", "phone": "0784119867 / 0741062799", "email": "jamesezra2002@gmail.com", "linkedin": "https://www.linkedin.com/in/ezra-ssekamwa-j-l-9a4709285/", "membership": "Student Member, UIPE · SM/11666", "profile": "A civil engineering graduate from Kabale University, with hands-on site exposure gained through three internships with building contractors in Kampala and Wakiso. Developed a practical understanding of construction site operations, architectural plans, and building methods by supporting site teams on active projects. Reliable, detail-oriented, and eager to bring academic training and site experience to a graduate engineering role in building or infrastructure construction.", "education": [{"title": "Bachelor of Engineering — Civil Engineering", "org": "Kabale University", "period": "2022 – 2026"}, {"title": "Uganda Advanced Certificate of Education", "org": "Lubiri Secondary School", "period": "2020"}, {"title": "Uganda Certificate of Education", "org": "Lakeside College Luzira", "period": "2018"}], "memberships": [{"title": "Student Member — Uganda Institution of Professional Engineers", "detail": "Credential ID: SM/11666"}], "experience": [{"role": "Internship Trainee", "org": "Hands of Mercy Contractors Ltd", "place": "Bugema University Science Laboratory Complex, Wakiso, Central Region, Uganda", "period": "June 2025 – July 2025", "bullets": ["Participated in various building construction activities including masonry, plastering, painting, terrazzo works, roof construction, door and window installation, compound paving, and other finishing works.", "Gained direct exposure to construction methods, sequencing of works, and site coordination between trades.", "Assisted in interpreting architectural and construction plans on site to support ongoing works.", "Observed site supervision, materials handling, and basic quality checks as part of on-the-job learning."]}, {"role": "Internship Trainee", "org": "Hands of Mercy Contractors Ltd", "place": "North Buganda Field Offices, Mukono", "period": "June 2024 – July 2024", "bullets": ["Assisted in a wide range of building construction works, including structural, finishing, and external works such as masonry, plastering, painting, terrazzo, roofing, openings installation, and compound paving.", "Supported site record-keeping and general coordination tasks alongside supervisors and tradesmen.", "Worked alongside engineers and craftsmen to ensure quality workmanship throughout the project."]}, {"role": "Internship Trainee", "org": "KATGO Construction Company Ltd", "place": "Kampala & Wakiso, Uganda", "period": "June 2023 – July 2023", "bullets": ["Assisted with consultancy works for the Midland High School Buntaba Main Classroom Complex, gaining first exposure to live site operations.", "Participated in residential building construction works in Kasangati, gaining practical exposure to building construction procedures, construction drawings and quality control.", "Assisted site personnel with routine tasks and observed core construction and site management practices.", "Developed foundational awareness of construction site safety, materials, and workflow."]}], "skills": [{"name": "Office Applications (MS Office)", "level": "Very Good"}, {"name": "Engineering Design Software (AutoCAD, ArchiCAD, Tekla Structural Design)", "level": "Moderate"}, {"name": "Teamwork and Communication", "level": "Good"}], "languages": [{"name": "English", "level": "C1 Advanced (reading, speaking, writing)"}, {"name": "Luganda", "level": "B2 (fluent)"}, {"name": "French", "level": "A1 (Beginner)"}], "referees": [{"name": "Mr. Joseph Sserwadda", "role": "Civil Engineer", "contact": ""}, {"name": "Mr. Thierry Mugisha", "role": "Civil Engineer", "contact": ""}], "note": "Copies of academic transcripts and UIPE membership are available upon request."};
var CK='ezra_resume_v1';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function arr(a){return Array.isArray(a)?a:[]}
function telLink(n){var d=String(n).replace(/[^\d+]/g,'');if(!d)return null;if(d.charAt(0)==='0')d='+256'+d.slice(1);return 'tel:'+d}
function sec(title,inner){return inner?'<section class="sec"><h3>'+esc(title)+'</h3><div>'+inner+'</div></section>':''}
var SECS=[['profile','Professional profile'],['education','Academic qualifications'],['memberships','Professional membership'],['experience','Internship experience'],['skills','Skills'],['languages','Languages'],['referees','Referees']];
function rich(t){return String(t==null?'':t).split(/\n{2,}/).map(function(p){p=p.trim();if(!p)return '';p=esc(p).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*\n]+)\*/g,'<em>$1</em>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+|mailto:[^)\s]+|tel:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');return '<p style="margin:0 0 .9em">'+p+'</p>'}).join('')}
function pairs(a){return arr(a).length?'<ul class="pairs">'+arr(a).map(function(s){return '<li><span>'+esc(s.name)+'</span><span>'+esc(s.level)+'</span></li>'}).join('')+'</ul>':''}
var BODY={
  profile:function(r){return r.profile?'<p style="margin:0">'+esc(r.profile)+'</p>':''},
  education:function(r){return arr(r.education).map(function(e){return '<div class="row"><div><div class="t">'+esc(e.title)+'</div><div class="o">'+esc(e.org)+'</div></div><div class="p">'+esc(e.period)+'</div></div>'}).join('')},
  memberships:function(r){return arr(r.memberships).map(function(m){return '<div class="row"><div><div class="t">'+esc(m.title)+'</div>'+(m.detail?'<div class="o">'+esc(m.detail)+'</div>':'')+'</div></div>'}).join('')},
  experience:function(r){return arr(r.experience).map(function(j){return '<div class="job"><div class="top"><span class="r">'+esc(j.role)+' \u2014 '+esc(j.org)+'</span><span class="d">'+esc(j.period)+'</span></div>'+(j.place?'<div class="pl">'+esc(j.place)+'</div>':'')+(arr(j.bullets).length?'<ul>'+arr(j.bullets).map(function(b){return '<li>'+esc(b)+'</li>'}).join('')+'</ul>':'')+'</div>'}).join('')},
  skills:function(r){return pairs(r.skills)},
  languages:function(r){return pairs(r.languages)},
  referees:function(r){return arr(r.referees).length?'<div class="refs">'+arr(r.referees).map(function(p){return '<div><b>'+esc(p.name)+'</b><span>'+esc(p.role)+'</span>'+(p.contact?'<span>'+esc(p.contact)+'</span>':'')+'</div>'}).join('')+'</div>'+(arr(r.referees).some(function(p){return !p.contact})?'<p class="note" style="margin-top:14px">Referee contact details available on request.</p>':''):''}
};
function layoutOf(r){
  var l=arr(r.layout).filter(function(x){return x&&typeof x.id==='string'}),seen={};
  l.forEach(function(x){seen[x.id]=1});
  SECS.forEach(function(s){if(!seen[s[0]])l.push({id:s[0],title:s[1],show:true})});
  return l;
}
function render(r){
  r=r||DEFAULT;var c=[];
  if(r.location)c.push('<li class="m">'+esc(r.location)+'</li>');
  if(r.phone)String(r.phone).split('/').forEach(function(n){n=n.trim();if(!n)return;var t=telLink(n);c.push('<li>'+(t?'<a href="'+esc(t)+'">'+esc(n)+'</a>':esc(n))+'</li>')});
  if(r.email&&/^[^\s@<>"]+@[^\s@<>"]+$/.test(r.email))c.push('<li><a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a></li>');
  var li=CMS.safeHref(r.linkedin);if(li)c.push('<li><a href="'+esc(li)+'" target="_blank" rel="noopener">LinkedIn</a></li>');
  if(r.membership)c.push('<li class="m">'+esc(r.membership)+'</li>');
  var pdf=typeof r.pdf==='string'&&r.pdf.indexOf(CMS.PUB)===0&&/\.pdf$/i.test(r.pdf)?r.pdf:null;
  var h='<div class="who"><h2>'+esc(r.name)+'</h2>'+(r.headline?'<p class="hl">'+esc(r.headline)+'</p>':'')+'<ul class="contact">'+c.join('')+'</ul>'
    +(pdf?'<a class="dl" href="'+esc(pdf)+'" target="_blank" rel="noopener">'+esc(r.pdf_label||'Download PDF')+'</a>':'')+'</div>';
  layoutOf(r).forEach(function(x){
    if(x.show===false)return;
    var title=x.title||(SECS.filter(function(s){return s[0]===x.id})[0]||[0,''])[1];
    var inner=x.custom?rich(x.text):(BODY[x.id]?BODY[x.id](r):'');
    h+=sec(title,inner);
  });
  if(r.note)h+='<p class="note">'+esc(r.note)+'</p>';
  var t=document.querySelector('h1.title');if(t)t.textContent=r.title||'Resume';
  document.title=(r.title||'Resume')+' \u2014 '+(r.name||'');
  return h;
}
var app=document.getElementById('app');
function show(r){app.innerHTML=render(r)}
var cached=null;try{cached=JSON.parse(localStorage.getItem(CK))}catch(e){}
show(cached||DEFAULT);
CMS.json('/rest/v1/site_content?select=value&key=eq.resume').then(function(rows){
  var v=rows&&rows[0]&&rows[0].value;if(v&&typeof v==='object'){try{localStorage.setItem(CK,JSON.stringify(v))}catch(e){}show(v)}
}).catch(function(){});
document.getElementById('top').addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})});
})();
</script>
</body></html>
